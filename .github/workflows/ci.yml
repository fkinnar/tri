# Compilation, vérifications et tests sur macOS, Linux et Windows, puis paquets en
# artefacts (.dmg, .tar.gz ; Windows : .msi, .zip). Lancé à la main (onglet Actions), à
# chaque version (tag v…), et chaque nuit si `main` a changé (22/10/2026 : build de nuit,
# publié sur la Release « nightly », remplacée à chaque fois), pas à chaque envoi. Sur un tag, les
# paquets sont publiés sur la page Releases (21/10/2026), avec la section de la version
# dans CHANGELOG.md. Voir doc/en/build.md, doc/en/packaging.md.
#
# Binaires sans HEIC (décidé le 19/10/2026, brevets HEVC, doc/en/licensing.md) : sans la
# feature `heif`, avec libjpeg-turbo.
name: CI

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 2 * * *" # 2 h UTC


env:
  CARGO_TERM_COLOR: always
  FEATURES: --no-default-features --features tri/turbojpeg,tri-gui/turbojpeg
  # Provenance gravée dans le binaire (build.rs, tri::update::Build) : version publiée
  # sur un tag, build de nuit la nuit, sinon build « personnel ».
  TRI_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || github.event_name == 'schedule' && 'nightly' || '' }}

jobs:
  # La nuit : rien à faire si `main` n'a pas bougé depuis le dernier build de nuit (tag
  # « nightly » sur le même commit).
  changes:
    name: Changements
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=true
          if [ "${{ github.event_name }}" = schedule ]; then
            last=$(gh api "repos/${{ github.repository }}/commits/nightly" --jq .sha 2>/dev/null || true)
            [ "$last" = "${{ github.sha }}" ] && build=false
          fi
          echo "dernier build de nuit : ${last:-aucun} ; à construire : $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Dépendances (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-dev zlib1g-dev cmake nasm pkg-config build-essential

      - name: Dépendances (macOS)
        if: runner.os == 'macOS'
        run: brew install libraw cmake nasm pkg-config

      # LibRaw par vcpkg (préinstallé sur les machines Windows de GitHub) : build.rs lit
      # LIBRAW_DIR (include/, lib/), les DLL sont dans bin/ pour les tests.
      - name: Dépendances (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install libraw:x64-windows
          choco install nasm -y --no-progress
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          "LIBRAW_DIR=$root" >> $env:GITHUB_ENV
          # Nom de la bibliothèque selon le port vcpkg (raw.lib, libraw.lib…).
          Get-ChildItem "$root\lib" -Filter "*raw*.lib" | ForEach-Object { Write-Host "trouvé : $($_.Name)" }
          # raw.lib si présente, sinon raw_r.lib (variante sûre en plusieurs fils, la seule
          # que construit le port vcpkg de LibRaw 0.22).
          $lib = Get-ChildItem "$root\lib" -Filter "*raw*.lib" | Sort-Object { $_.BaseName -match "_r$" } | Select-Object -First 1
          "LIBRAW_LIB=$($lib.BaseName)" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets ${{ env.FEATURES }} -- -D warnings

      # Tous les programmes de tests, même après un échec : tout voir en un passage.
      - name: Tests
        run: cargo test --workspace --no-fail-fast ${{ env.FEATURES }}

      # Paquets prêts à installer (doc/en/packaging.md) : .dmg macOS, .tar.gz Linux,
      # .msi et .zip Windows.
      - name: Outil des notices de licence
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: WiX (Windows)
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2

      - name: Paquet
        if: runner.os != 'Windows'
        run: python3 scripts/package.py

      - name: Paquet (Windows)
        if: runner.os == 'Windows'
        run: python scripts/package.py

      - uses: actions/upload-artifact@v7
        with:
          name: tri-${{ matrix.os }}
          path: |
            target/dist/*.dmg
            target/dist/*.tar.gz
            target/dist/*.msi
            target/dist/*.zip
            LICENSE
            README.md
            README.fr.md
            CHANGELOG.md
          if-no-files-found: warn

  # Sur un tag v… : une Release (préversion tant que le nom contient un « - »), avec les
  # paquets macOS, Linux et Windows (.msi, .zip portable) et les notes de
  # la version tirées de CHANGELOG.md (« ## 1.0.0-alpha.2 — … » jusqu'au titre suivant).
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: tri-*
          path: artifacts
          merge-multiple: true

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Version $version." > notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.msi' -o -name '*.zip' \))
          printf 'paquet : %s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --title "tri $version" --notes-file notes.md "${files[@]}"

  # La nuit : la Release « nightly » (préversion) remplacée par les paquets du jour. Son
  # tag n'est pas un numéro de version : la recherche de mise à jour l'ignore.
  nightly:
    name: Build de nuit
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20 # pour la liste des derniers commits

      - uses: actions/download-artifact@v8
        with:
          pattern: tri-*
          path: artifacts
          merge-multiple: true

      - name: Publier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          mapfile -t files < <(find artifacts -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.msi' -o -name '*.zip' \))
          printf 'paquet : %s\n' "${files[@]}"
          short="${GITHUB_SHA::7}"
          {
            echo "Build de nuit du $(date -u +%d/%m/%Y), commit $short : pas une version publiée,"
            echo "pour les testeurs. Nightly build of $(date -u +%Y-%m-%d), commit $short: not a release."
            echo
            git log -15 --format='- %s' "$GITHUB_SHA"
          } > notes.md
          gh release create nightly --prerelease --target "$GITHUB_SHA" \
            --title "tri nightly $short" --notes-file notes.md "${files[@]}"
