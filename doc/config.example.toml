# Fichier de configuration de tri : toutes les valeurs par défaut, commentées.
#
# Emplacement (lu par l'interface et par la ligne de commande) :
#   Linux    $XDG_CONFIG_HOME/tri/config.toml, sinon ~/.config/tri/config.toml
#   macOS    ~/Library/Application Support/tri/config.toml
#   Windows  %APPDATA%\tri\config.toml
# ou ailleurs avec --config FICHIER.
#
# Toute clé absente prend sa valeur par défaut : il suffit de copier les lignes à changer.
# Une clé inconnue (faute de frappe) est signalée au démarrage ; les valeurs par défaut
# sont alors utilisées pour tout le fichier. Un test vérifie que ce fichier reste égal aux
# valeurs du code. Voir doc/settings.md.

[preview]
# Côté long des vignettes de la grille (pixels).
thumbnail = 400
# Côté long de l'aperçu plein écran (pixels), ou "auto" : plus grand côté de l'écran
# principal (2560 sur un écran 2560×1440).
standard = "auto"
# Taille "auto" quand l'écran est inconnu (ligne de commande).
auto_fallback = 2560
# Rendu RAW de l'aperçu standard en demi-résolution (≈ 0,35 s au lieu de ≈ 3,8 s sur un RAF
# X-T4) si la moitié du côté long du RAW vaut au moins `half_size_margin` × `standard`.
# 1.0 : dès qu'elle couvre la taille ; plus grand : marge de netteté.
half_size_margin = 1.0
# Aperçu boîtier (JPEG embarqué) refusé s'il est plus petit que cette fraction de
# `standard` (certains boîtiers n'embarquent qu'une vignette de 160 px).
embedded_min_ratio = 0.5
# Plus petit JPEG embarqué accepté pour le 1:1 du JPEG boîtier (pixels, côté long).
min_embedded_full = 1024

[render]
# Développement RAW (LibRaw). Changer un réglage recalcule les rendus RAW concernés.
# Balance des blancs du boîtier (false : « lumière du jour »).
camera_wb = true
# Luminosité (1.0 = défaut LibRaw).
bright = 1.0
# Luminosité automatique de LibRaw : désactivée, elle « corrige » une sous-exposition
# qu'on cherche justement à voir en triant.
auto_bright = false

[cache]
# Dossier du cache. Absent : emplacement du système (~/.cache/tri, ~/Library/Caches/tri,
# %LOCALAPPDATA%\tri). Exemple :
# dir = "/mnt/ssd/cache-tri"
# Qualité JPEG des entrées (1 à 100). Les entrées déjà écrites sont gardées : vider le
# cache (tri --clear-cache) pour les réécrire.
jpeg_quality = 90
# Taille maximale de chaque niveau 1:1 (100 % RAW, 1:1 du JPEG boîtier), en Mo : au-delà,
# les moins récemment utilisés sont supprimés au démarrage (~5 Mo par 1:1 de 26 Mpx).
# 0 : pas de limite.
zoom_max_mb = 2000

[scheduler]
# Workers parallèles pour les vignettes et images plates, ou "auto" : moitié des cœurs.
# Les rendus RAW passent toujours par un seul worker (LibRaw est déjà multithreadé).
light_workers = "auto"
# Vignettes d'abord, puis aperçus boîtier, puis rendus RAW (false : tout mélangé).
thumbnails_first = true
# Analyser l'exposition de tout le dossier en fond (histogrammes, badges de la grille),
# après vignettes et aperçus boîtier ; false : seulement l'image affichée et ses voisines.
exposure = true

[xmp]
# Nom d'un NOUVEAU sidecar : "darktable" (IMAGE.RAF.xmp, un par fichier) ou "adobe"
# (IMAGE.xmp, Lightroom, Capture One, Bridge ; partagé par le RAF et le JPG d'une paire).
# Un sidecar existant est toujours réutilisé, le plus récent si les deux existent.
sidecar = "darktable"
# Plusieurs couleurs par image (comme darktable) ; false : une seule, une nouvelle couleur
# remplace la précédente (comme Lightroom).
multiple_colors = false

[places]
# Emplacements proposés par le panneau des dossiers. Masquer les sauvegardes Time Machine,
# reconnues à leur contenu (pas à leur nom) :
hide_backups = true
# Emplacements à masquer : motifs comparés au nom ou au chemin, sans tenir compte de la
# casse, avec * (n'importe quelle suite) et ? (un caractère). Exemple :
# exclude = ["Backup", "/mnt/*"]
exclude = []
# Volumes fixés : disques externes toujours branchés (travail, sauvegarde), sans bouton
# d'éjection pour éviter un accident ; mêmes motifs qu'exclude. Exemple :
# fixed = ["Work", "Backup"]
fixed = []
# Surveillance des volumes (ms) : un disque ou une carte branchés apparaissent d'eux-mêmes
# dans le panneau des dossiers ; 0 : pas de surveillance (F5 ou « Actualiser »).
watch_ms = 2000

[develop]
# Voir ses développements dans tri (Maj+B en plein écran, puis b : JPEG boîtier, rendu
# RAW, développé) : darktable-cli refait l'image avec l'historique du sidecar .xmp, à la
# demande (quelques secondes par image), gardée en cache et refaite si le .xmp change.
# "auto" : cherché dans le PATH, aux emplacements habituels, puis sous Linux en AppImage
# (~/AppImages, ~/Applications, ~/.local/bin, ~/bin, téléchargements, /opt) et en
# Flatpak (org.darktable.Darktable) ; un chemin (darktable-cli, ou une AppImage) ;
# "flatpak" : celui du Flatpak ; "" : jamais.
# Rien n'est écrit chez vous (configuration propre, bibliothèque en mémoire).
darktable = "auto"
# Haute qualité (--hq) : un peu plus fidèle, un peu plus lent.
high_quality = false

[export]
# Export d'images développées par darktable (Ctrl+E), avec un préréglage par usage. Rien
# n'est écrasé (darktable ajoute _01…).
# Préréglage proposé par défaut (identifiant) pour un rendu de RAW, et pour une image déjà
# développée (JPEG boîtier, JPEG…) ; dans la séance, le dernier choisi l'emporte. Inconnu
# ou qui ne s'applique pas : le premier de la liste.
default_raw = "edit"
default_flat = "asis"
# Paire RAW + JPEG sélectionnée : les deux sont exportés (le RAW rendu par darktable ou
# LibRaw, le JPEG développé par l'appareil) ; le JPEG prend ce suffixe :
# DSCF0001.jpg (rendu du RAW) et DSCF0001-camera.jpg (JPEG de l'appareil).
camera_suffix = "-camera"
# Rapport d'export (Ctrl+Maj+E) : exports terminés gardés d'une session à l'autre, les
# plus récents (0 : sans limite) ; effaçable depuis le rapport.
report_max = 500

[export.sharpening]
# Accentuation de sortie (clé sharpen des préréglages), appliquée après la réduction, comme
# Lightroom : masque flou de rayon radius (pixels de l'image écrite), de force amount
# (1,0 : toute la différence avec l'image floue), au-delà d'un seuil threshold (niveaux
# sur 8 bits : en dessous, rien, pour ne pas accentuer le bruit). Avec darktable, un
# préréglage qui accentue passe par un TIFF 16 bits temporaire (une seule compression).
screen_radius = 0.6
screen_amount = 0.6
screen_threshold = 2.0
print_radius = 1.2
print_amount = 0.9
print_threshold = 3.0

# Préréglages d'export : [export.profiles.<identifiant>], autant que voulu. Une clé absente
# vient du préréglage fourni de même identifiant (edit, asis, web), sinon d'un JPEG sRGB.
# name : nom affiché (vide : nom fourni traduit, sinon l'identifiant) ;
# format : "jpeg", "tiff" ou "png" ; bits : 8 (JPEG), 8 ou 16 (PNG), 8, 16 ou 32 (TIFF) ;
# quality : qualité JPEG (1 à 100) ;
# color : "srgb", "adobergb", "rec709", "rec2020", "prophoto" (ceux de darktable ; les
#   trois derniers linéaires), "display-p3", le chemin d'un profil .icc, ou "" (celui
#   du développement) ;
# intent : "perceptual", "relative", "saturation", "absolute", ou "" (celle du
#   développement) ;
# max_side : côté long maximal en pixels, 0 : pleine définition ;
# suffix : ajouté au nom du fichier ("-web" : DSCF0001-web.jpg) ;
# folder : dossier des fichiers : "/…" absolu, "~/…" depuis le dossier personnel, sinon
#   relatif au dossier de chaque image ("export" : un sous-dossier à côté des images,
#   "" ou "." : à côté d'elles) ; variables de darktable permises ($(YEAR)…).
# passthrough : JPEG sans recompression si possible (JPEG d'origine copié tel quel, JPEG
#   boîtier écrit tel quel ; défaut) ; une image à réduire est réencodée ; sans effet sur
#   un rendu darktable ou LibRaw, ni hors JPEG ;
# applies_to : "all" (partout), "raw" (rendu d'un RAW : darktable, LibRaw) ou "flat" (image
#   déjà développée : JPEG boîtier, JPEG, TIFF…) ; la boîte d'export ne propose que les
#   préréglages qui conviennent ;
# sharpen : accentuation de sortie, "none", "screen" (écran) ou "print" (tirage), réglée
#   dans [export.sharpening] ; une copie sans recompression n'est pas accentuée.
[export.profiles.edit]
# Vers un éditeur externe : TIFF 16 bits, ProPhoto (linéaire), pleine définition.
name = ""
format = "tiff"
bits = 16
quality = 90
color = "prophoto"
intent = ""
max_side = 0
suffix = ""
folder = "export"
passthrough = true
applies_to = "all"
sharpen = "none"

[export.profiles.asis]
# JPEG tel quel : un JPEG d'origine est copié sans rien toucher (taille, espace couleur :
# un JPEG Adobe RGB le reste) ; un RAW sort en JPEG pleine taille, dans l'espace du
# développement.
name = ""
format = "jpeg"
bits = 8
quality = 100
color = ""
intent = ""
max_side = 0
suffix = ""
folder = "export"
passthrough = true
applies_to = "flat"
sharpen = "none"

[export.profiles.web]
# Publication : JPEG sRGB, 2048 pixels au plus.
name = ""
format = "jpeg"
bits = 8
quality = 90
color = "srgb"
intent = ""
max_side = 2048
suffix = ""
folder = "export"
passthrough = true
applies_to = "all"
sharpen = "screen"

# Préréglages de recadrage (versions, r en plein écran) : [versions.presets.<identifiant>],
# autant que voulu ; choisis dans la barre du recadrage (ou p), puis on ajuste le cadre.
# Une clé absente vient du préréglage fourni de même identifiant (story, post).
# name : nom de la version créée (vide : nom fourni traduit, sinon l'identifiant) ;
# ratio : "free", "original", ou "l:h" dans l'orientation voulue ("9:16" : portrait) ;
# profile : préréglage d'export proposé (identifiant), "" : aucun.
[versions.presets.story]
# Story (Instagram…) : 9:16, pour le web.
name = ""
ratio = "9:16"
profile = "web"

[versions.presets.post]
# Publication : 4:5, pour le web.
name = ""
ratio = "4:5"
profile = "web"

[update]
# Rechercher une mise à jour (aide, tri --check-update), sur demande seulement : liste des
# versions publiées (API des Releases GitHub, lue par curl) et délai maximal (secondes).
url = "https://api.github.com/repos/fkinnar/tri/releases"
# Build de nuit ou personnel : commits de main qui lui manquent (API « compare » de
# GitHub, {commit} = le commit compilé).
compare_url = "https://api.github.com/repos/fkinnar/tri/compare/{commit}...main"
timeout_s = 10
# Bouton « Signaler un problème » de l'aide : formulaire de GitHub, prérempli avec la
# version et le système.
issue_url = "https://github.com/fkinnar/tri/issues/new?template=bug.yml"

[watch]
# Surveillance du dossier ouvert (ms) : images ajoutées, retirées ou modifiées, notes XMP
# modifiées par un autre logiciel (darktable…) apparaissent d'elles-mêmes, une fois le
# dossier stable pendant cet intervalle (une copie en cours ne recharge qu'une fois, à la
# fin). 0 : pas de surveillance.
interval_ms = 1000

[exposure]
# Histogramme et alertes d'exposition, calculés sur les données du capteur pour un RAW.
# Seuil de saturation en IL sous le blanc du capteur (0 : seulement au blanc). -0.02 (1,4 %)
# par défaut : un RAF X-T4 enregistre un rouge ou un bleu saturé un peu sous le blanc vers
# les bords de l'image (correction de vignetage du boîtier).
over_ev = -0.02
# Seuil des ombres bouchées, en IL sous le blanc (-10 : moins de 1/1024 de la plage).
under_ev = -10.0
# Cases de l'histogramme linéaire.
linear_bins = 1024
# Étendue de l'histogramme en IL sous la saturation, et cases par IL.
ev_range = 16.0
ev_bins_per_stop = 8
# Côté long du masque des zones saturées / bouchées (cases).
mask_size = 1024
# Part des pixels d'une case qui doivent être bouchés pour la marquer (0 à 1) : pas
# tous, le bruit du capteur près du noir en remonte presque toujours un.
mask_under_share = 0.5

[offload]
# Déchargement d'une carte : dossier racine (~ accepté) du premier déchargement ; ensuite,
# la racine du dernier déchargement est retenue. Le dossier de la séance y est créé
# (proposé : AAAA-MM-JJ_, à compléter ou remplacer ; l'année va dans la racine).
destination = "~/Pictures"
# Relire chaque copie et comparer son empreinte à l'original.
verify = true
# Les doublons se jugent sur le dossier de destination (une copie identique déjà présente
# est ignorée) : une même carte peut être déchargée à deux endroits. true : ignorer aussi ce
# qui a déjà été déchargé n'importe où (historique global).
skip_known = false
# Fichier de l'historique des déchargements (~ accepté) ; vide : offload-history.tsv dans le
# dossier de données (Linux ~/.local/share/tri, macOS ~/Library/Application Support/tri,
# Windows %APPDATA%\tri).
history = ""
# Choix par défaut de la boîte de déchargement (cochés ou non) : ne copier que les RAW
# (JPEG du boîtier laissés sur la carte) ; à la fin, ouvrir le dossier de la séance,
# éjecter la carte, supprimer de la carte les fichiers copiés et vérifiés. En ligne de
# commande, éjection et suppression demandent une option explicite (--eject,
# --delete-copied).
raw_only = false
open_after = true
eject_after = true
delete_after = false
# Avec raw_only et delete_after : supprimer aussi les JPEG laissés sur la carte (non copiés).
delete_left = false

[files]
# Renommer, supprimer, copier ou déplacer une image : l'autre image de sa paire RAW+JPEG
# (même nom, autre extension) suit. Ses sidecars XMP suivent toujours.
pairs = true
# Supprimer = mettre à la corbeille (récupérable) ; false : suppression définitive.
trash = true
# Éditeur externe : programme puis arguments ; "{files}" est remplacé par les fichiers
# (ajoutés à la fin sinon). Vide : application par défaut du système. Exemples :
# ["darktable"], ["open", "-a", "darktable"] (macOS), ["gimp", "{files}"].
editor = []
# Copier / déplacer vers… : nombre de destinations récentes proposées (touches 1 à 9).
recent = 9

[sharpness]
# Carte de netteté (focus peaking, p en 1:1) : un pixel est marqué si le gradient de
# luminance (Sobel, 0 à 510 ; un bord franc noir / blanc donne 255) dépasse ce seuil. Fixe,
# pas relatif à l'image : dans une rafale, la photo la plus nette montre plus de contours.
# Plus bas : plus de contours, bruit compris. 48 : une photo molle n'est presque plus
# marquée, une nette l'est franchement (32 marquait aussi les molles).
threshold = 48
# Épaississement des contours marqués (pixels de chaque côté ; 0 : aucun) : un contour d'un
# pixel est à peine visible à 1:1 sur un écran haute densité.
spread = 1
# Voisins marqués (sur 8) qu'un pixel marqué doit avoir pour rester marqué : un contour est
# une ligne (2 voisins au moins), le bruit à ISO élevé fait des points isolés. 0 : tout
# garder.
min_neighbours = 2
# Score de netteté (repérer les photos floues, filtre f b) : l'image est réduite à ce côté
# long (pixels), découpée en cases (sur le côté long), et le score est le gradient moyen de
# la part des cases les plus nettes (un fond flou volontaire ne pénalise pas un sujet net).
score_side = 1536
score_tiles = 16
score_top_share = 0.05
# Luminance étirée entre ces centiles avant la mesure (0,01 : 1 % et 99 %) : une photo
# sous-exposée mais nette ne passe pas pour floue. Écart minimal (0 à 255) entre eux ; en
# dessous, l'image n'a pas de détail (toute blanche ou noire) et son score est nul.
score_stretch = 0.01
score_min_range = 8
# Photo jugée floue sous cette fraction de la médiane des scores du dossier : le score ne
# se juge pas dans l'absolu (ISO, objectif, accentuation du boîtier).
blur_ratio = 0.5
# Ou sous cette fraction de la médiane de ses voisines (photos avant et après dans le
# dossier : même scène, même rafale) : attrape une ratée isolée dans une série nette.
# neighbours = 0 : pas de comparaison aux voisines.
neighbours = 3
neighbour_ratio = 0.8
# Piles d'images semblables connues ([similarity]) : une photo n'est plus comparée à ses
# voisines (une autre pile est une autre scène) mais aux autres images de sa pile, si elle
# en compte au moins group_min ; jugée floue sous group_ratio × leur médiane. Le dossier
# compte toujours (une rafale floue de bout en bout). Piles du jugement : seuil
# group_threshold, plus large que celui des piles affichées.
group_min = 3
group_ratio = 0.8
group_threshold = 0.45
# Curseur de sévérité de la barre des filtres (à côté des gouttes) : au centre, les seuils
# ci-dessus ; tout à droite (plus strict, plus de photos floues) ils sont multipliés par
# strictness_span, tout à gauche (plus souple) divisés par lui (sans dépasser 1). Le
# réglage est retenu par dossier.
strictness_span = 2.0
# Scores de tout le dossier calculés en fond (cache d'analyse).
background = true

[similarity]
# Regroupement des images semblables (rafales, séries d'une même scène) en piles.
# Empreintes de tout le dossier calculées en fond (cache d'analyse, juste après les
# vignettes) ; false : pas de regroupement.
background = true
# Côté long de la petite image d'où l'empreinte est tirée (pixels) : petite, elle ne
# regarde que la composition et les couleurs, pas les détails.
side = 64
# Poids de la composition dans la distance entre deux images (0 à 1) ; le reste : les
# couleurs.
shape_weight = 0.5
# Seuil par défaut (distance de 0 à 1) : deux images voisines plus proches vont dans le
# même groupe. Centre du curseur des piles quand il n'est pas calculé d'après le dossier
# (auto), et repère des bornes de ce calcul.
threshold = 0.25
# Centre du curseur des piles calculé d'après le dossier : la coupure qui sépare le mieux
# les images d'une même série des changements de scène.
auto = true
# Images voisines (liens connus) en deçà desquelles le centre reste threshold.
auto_min_links = 8
# Séparation minimale entre séries et changements de scène (0 à 1) : en deçà, pas de
# vraie coupure, le centre reste threshold.
auto_separation = 0.5
# Bornes du centre calculé : entre threshold / auto_range et threshold × auto_range.
auto_range = 2.0
# Étendue du curseur des piles : à fond à droite (plus strict, petites piles), le seuil
# est divisé par cette valeur ; à fond à gauche, multiplié. La sévérité choisie est
# retenue pour chaque dossier.
strictness_span = 3.0
# Écart de temps de prise de vue au-delà duquel deux images voisines ne sont jamais
# groupées (secondes ; 0 : sans limite).
max_gap_s = 60.0

[i18n]
# Langue des textes (interface, ligne de commande, messages) : "auto" (langue du système ;
# l'anglais si elle n'est pas disponible), "fr" ou "en".
language = "auto"

[data]
# Dossier des données (historique des déchargements, dernier dossier ouvert). Absent :
# Linux ~/.local/share/tri, macOS ~/Library/Application Support/tri, Windows %APPDATA%\tri.
# Exemple :
# dir = "/chemin/vers/données"

[gui]
# "dark", "light", "system" ou "neutral" (gris neutre, façon Lightroom : panneaux gris
# foncé, fond central gris neutre, qui ne fausse pas le jugement des images ; couleurs :
# [gui.colors] neutral_*).
theme = "dark"
# Jeu de raccourcis : "classic" (flèches, Début / Fin, Suppr, Ctrl+C / Ctrl+X copier /
# déplacer vers, Ctrl+Z / Ctrl+Y), "vim" (hjkl, gg / G, Ctrl+U / Ctrl+D, x, y, dw / yw,
# u / Ctrl+R) ou "both" (les deux). Le reste (notation, filtres, piles, zoom…) est commun.
profile = "classic"
# Changer de panneau au clavier, comme tmux : le leader, puis h / l (ou les flèches) pour
# le panneau de gauche / de droite, o pour le suivant. Le panneau qui a le clavier passe
# ses touches d'abord (dossiers : flèches / hjkl, Entrée ouvre ; métadonnées : défiler,
# y copie) ; les autres gardent leur effet ; Échap rend le clavier aux images. Le leader
# puis b : signaler un problème (formulaire de GitHub prérempli).
leader = "Ctrl+b"
# Délai maximal entre deux touches d'une séquence (ms), comme le timeoutlen de vim : « gg »
# (première image, profil vim) doit être tapé dans ce délai.
key_sequence_timeout_ms = 1000
# Touche qui est un raccourci et le début d'un autre (y copie, y w copie la pile) : délai
# d'attente de la suite (ms) avant d'agir seule.
key_ambiguous_timeout_ms = 300
# Taille initiale de la fenêtre (points).
window = [1400.0, 900.0]
# Rendus RAW : "on-demand" (image affichée et voisines, en mode RAW seulement) ou
# "background" (tout le dossier, après vignettes et aperçus boîtier).
raw_previews = "on-demand"
# Temps maximal de chargement des vignettes par image affichée (ms) : au-delà, la suite
# attend l'image suivante, pour ne pas figer l'interface.
load_budget_ms = 8
# Barres de progression de la barre d'état : largeur (points), et masquées une fois
# terminées (false : toujours affichées).
progress_width = 160.0
progress_hide_done = true
# Délai avant d'afficher les barres de progression après un changement de filtre (ms) :
# souvent tout est déjà en cache, une barre montrée un instant ne se lit pas.
progress_delay_ms = 400
# Côté des boutons à icône du bandeau de notation (avance automatique, image précédente /
# suivante), en points.
bar_icon_size = 24.0
# Barre de filtres (type, étoiles, drapeau, couleurs) affichée au démarrage ; Maj+F
# l'affiche ou la masque.
filter_bar = true
# Sans dossier en argument, rouvrir le dernier dossier ouvert (mémorisé dans le dossier de
# données : ~/.local/share/tri, ~/Library/Application Support/tri, %APPDATA%\tri).
reopen_last = true
# Ordre des images : "name" (nom, l'ordre du boîtier), "captured" (date de prise de vue,
# plusieurs boîtiers dans une séance) ou "modified" (date de modification), et le sens ;
# f s et f r les changent, le choix est retenu (une paire RAW+JPEG reste ensemble).
sort = "name"
sort_descending = false
# Garder d'un lancement à l'autre ce qu'on affiche ou masque d'une touche (collimateur,
# carte de netteté, zones, histogramme, panneaux, barres, avance automatique), dans
# gui-state.toml du dossier de données ; les valeurs ci-dessous ne servent alors qu'au
# premier lancement. false : toujours les valeurs de ce fichier.
remember_display = true
# Bandeau de notation à la souris (drapeaux, étoiles, couleurs de l'image sélectionnée)
# affiché au démarrage ; Maj+N l'affiche ou le masque. Le clic droit sur une image ouvre
# une boîte avec les mêmes contrôles.
rating_bar = true
# Barre du haut : icône et nom de l'application à gauche, comme darktable (masquée, comme
# tout le reste, en mode concentration : F11 ou Ctrl+Maj+F).
title_bar = true
# Taille du nom dans la barre du haut (points ; l'icône un peu plus grande), et durée de
# l'indication « F11 pour en sortir » en entrant en mode concentration (ms).
title_bar_size = 26.0
focus_mode_hint_ms = 3000
# Après une note (clavier ou bandeau), passer à l'image suivante ; Maj+A l'active ou le
# désactive. Si la note fait sortir l'image d'un filtre, la suivante est déjà sélectionnée :
# on ne saute pas une image. L'autre image d'une paire RAW+JPEG, notée en même temps, est
# sautée.
auto_advance = false
# Annuler (u, Ctrl+Z) : nombre de pas gardés dans l'historique de la session (Ctrl+H le
# montre). Rien n'est gardé d'un lancement à l'autre.
history = 200

[gui.grid]
# Dimensions en points. cell : taille des vignettes au premier lancement et au double-clic
# sur le curseur de taille (bas de la grille ; + / - au clavier, * pour tout voir à
# l'écran) ; la taille choisie est ensuite retenue. cell_min / cell_max : bornes du curseur.
cell = 200.0
cell_min = 60.0
cell_max = 600.0
gap = 8.0
# Infos sur les vignettes (nom, format, notes, badges) au démarrage ; Maj+T ou le bouton
# du bas les masquent pour laisser toute la place à l'image (choix ensuite retenu).
info = true
# Hauteur réservée au nom du fichier sous la vignette.
label = 18.0
# Marge intérieure de la cellule.
padding = 6.0
# Longueur maximale du nom affiché (caractères).
name_chars = 24
# Vignettes gardées en mémoire graphique au plus.
textures = 600
# Taille des notes (étoiles, couleurs, drapeau) sur les vignettes.
marks = 12.0
# Opacité de la vignette d'une photo rejetée (0 : invisible, 1 : normale).
rejected_opacity = 0.35
# Épaisseur du cadre de la vignette survolée par la souris.
hover_frame = 2.0
# Épaisseur du cadre des vignettes sélectionnées (sélection multiple).
marked_frame = 3.0
# Goutte sous les vignettes des photos jugées floues (score de netteté, voir
# [sharpness]).
blur_badge = true
# Largeur du curseur de similarité de la barre des filtres.
stack_slider = 90.0
# Largeur du curseur de sévérité du flou de la barre des filtres.
blur_slider = 90.0
# Largeur du curseur de taille des vignettes, en bas de la grille.
size_slider = 90.0
# Piles (images semblables regroupées) affichées au démarrage ; false : chaque image
# seule, Ctrl+S ou le bouton pile les affichent (instantané : les empreintes se
# calculent en fond, voir [similarity] background).
stacks = false
# Recherche par nom de fichier (/ ou Ctrl+F en grille) : largeur du champ (points).
search_width = 200.0

[gui.view]
# Attente sur une image avant de lancer son 100 % RAW (ms) : les images seulement
# traversées en enchaînant les flèches ne lancent pas un calcul de plusieurs secondes.
full_raw_dwell_ms = 400
# Grandes textures (aperçus, 1:1) gardées en mémoire graphique ; un 1:1 de 26 Mpx occupe
# ~100 Mo.
textures = 8
# Déplacement d'une image zoomée par appui (Maj + flèches, Maj + hjkl), en fraction de la
# vue.
pan_step = 0.2
# Taille des notes (étoiles, couleurs, drapeau) en plein écran.
marks = 18.0
# Collimateur de mise au point (lu dans le RAW : Fujifilm pour l'instant), affiché au
# démarrage en plein écran et en comparaison ; m l'affiche ou le masque. Forme : "square"
# (comme dans le viseur), "cross", "circle" ou "heart". Taille et épaisseur en points.
focus_point = true
focus_marker = "square"
focus_marker_size = 28.0
focus_marker_width = 2.0
# Aide-mémoire des touches (b, z, i, o, Échap) en haut à droite du plein écran ; masqué par
# défaut : il mord sur l'image, et F1 ouvre l'aide complète.
key_hints = false
# Mode concentration (F11) : infos (numéro, source, taille) et notes dessinées sur l'image,
# puisque la barre d'état et le bandeau sont masqués ; Ctrl+I les masque ou les affiche.
image_info = true
# 1:1 (z ou bouton « 1:1 ») centré sur le collimateur quand le boîtier l'a enregistré
# (c'est là qu'on juge la netteté) ; sinon au milieu de l'image. Le double-clic, lui,
# zoome sur le point cliqué.
zoom_on_focus_point = true
# Piles actives (Ctrl+S, bouton pile), en plein écran : flèches gauche / droite dans la
# pile, haut / bas à la pile d'avant / d'après ; au bout de la pile, true : on repart de l'autre
# bout ; false : on s'arrête.
stack_wrap = false
# Superpositions (o, Maj+O pour l'orientation, voir overlay.md) : épaisseur des traits (points) ; opacité
# des grilles intégrées (tiers, nombre d'or, diagonales), couleur : [gui.colors] overlay.
overlay_line_width = 1.0
overlay_opacity = 0.6

[gui.zoom]
# Zoom en plein écran : paliers de + et - (1.0 = 100 % : un pixel de l'image par pixel de
# l'écran ; * passe à 100 %, / revient à l'ajusté, z bascule ajusté / 100 %). À la souris
# et au pavé tactile, en continu : pincer, ou Ctrl / Cmd + molette (défiler déplace
# l'image). Entre min et max ; sous l'ajusté, l'image est plus petite que l'écran.
steps = [0.125, 0.25, 0.5, 1.0, 2.0, 4.0]
max = 4.0
min = 0.1
# Loupe, en vue ajustée : tant que cette touche est maintenue (une touche libre, écrite
# comme dans [keys] : "t", "F3"… ; ou "shift", "ctrl", "alt" ; "none" : pas de loupe),
# l'image à 100 % (loupe_scale) sous le pointeur, dans un carré de loupe_size points,
# après loupe_delay_ms (pour ne pas clignoter sur une pression brève). Une touche déjà
# liée à une action est signalée.
loupe_key = "t"
loupe_delay_ms = 150
loupe_size = 320.0
loupe_scale = 1.0

[gui.dialogs]
# Boîtes ouvertes près du clic (notation, éjection, déchargement, renommage, corbeille) :
# elles se déplacent en glissant leur fond. Marge intérieure, espace entre les éléments,
# marge des boutons, largeurs minimale et maximale, taille des titres, en points.
margin = 18.0
spacing = 10.0
button_padding = 10.0
min_width = 340.0
max_width = 520.0
title_size = 17.0
# Couleur des titres (accent, turquoise), soulignés d'une ligne de séparation.
title_color = "#50bedc"
# Épaisseur du liseré de cette couleur autour du panneau qui a le clavier (points).
focus_frame_width = 1.0
# Côté des boutons à icône (actions sur le fichier, dans la boîte du clic droit), en points.
icon_size = 34.0
# Largeur minimale de l'aide (F1), en points.
help_width = 620.0
# Défilement de l'aide au clavier : par flèche haut / bas, en points (pages : Page préc. /
# suiv., Ctrl+U / Ctrl+D).
help_scroll_line = 40.0

[gui.compare]
# Comparaison côte à côte des images sélectionnées (c). Images comparées au plus (au-delà,
# les premières) : chacune garde un aperçu, et en 1:1 son 1:1 (~100 Mo de mémoire graphique
# pour 26 Mpx).
max = 6
# Espace entre les images (points).
gap = 4.0
# Épaisseur du cadre de l'image active (celle que l'on note).
frame = 3.0

[gui.crop]
# Recadrage (versions) : r en plein écran. Pas du clavier (flèches ou hjkl : déplacer ;
# avec Maj : côté droit, bas), en proportion de l'image.
step = 0.01
# Voile autour du cadre : couleur et opacité (0 à 1).
shade = "#282828"
shade_opacity = 0.65
# Épaisseur du cadre, côté des poignées, distance de prise d'un bord (points).
line_width = 1.5
handle_size = 9.0
handle_grab = 10.0

[gui.folders]
# Panneau des dossiers, à gauche de la grille : affiché au démarrage (Maj+D l'affiche ou le
# masque), largeur initiale (points, le bord se tire à la souris), retrait par niveau,
# dossiers cachés (.xxx) montrés ou non.
visible = true
width = 240.0
indent = 14.0
hidden = false
# Recherche de dossiers (/ ou Ctrl+F dans le panneau) : niveaux de sous-dossiers
# parcourus au plus, et nombre de résultats au plus.
search_depth = 4
search_results = 200
# Case « Sous-dossiers » du panneau (gardée d'une session à l'autre) : les images des
# sous-dossiers du dossier ouvert s'affichent aussi, sur ce nombre de niveaux au plus.
subfolders_depth = 3

[gui.histogram]
# Histogramme (données du capteur pour un RAW), en haut du panneau des métadonnées :
# affiché au démarrage (touche i), échelle "ev" (IL sous la saturation) ou "linear"
# (Maj+I bascule). Grand histogramme (Maj+E, ou clic sur l'histogramme du panneau) : part
# de la largeur de la fenêtre.
visible = true
scale = "ev"
large = 0.7
# IL montrés en échelle IL : 0 = plage utile de l'image (~13,9 IL pour un RAW 14 bits,
# ~11,7 pour un JPEG, valeurs sRGB ramenées en lumière linéaire) ; positif : plafond.
ev_shown = 0.0
# Zones saturées et bouchées superposées à l'image au démarrage (touche o), et leur
# opacité. Zones saturées colorées par canal (clip_red / clip_green / clip_blue, mélangées
# si deux canaux, clip_over si les trois) ; false : clip_over pour toute saturation.
clipping = false
clipping_opacity = 0.7
clipping_channels = true
# Badges de la grille : part des pixels saturés / bouchés (canal le plus touché, 0 à 1)
# au-delà de laquelle une vignette est signalée.
badge_over = 0.005
badge_under = 0.05
# Pastilles saturés / bouchés dans les coins de l'histogramme : allumées au-delà de cette
# part des pixels (0,001 = 0,1 %), pas pour quelques pixels morts.
indicator_min = 0.001
# Courbe de l'histogramme : nombre de classes sur sa largeur, et lissage (écart type, en
# classes ; 0 : sans lissage). Pas d'échelle verticale : seule la forme compte.
classes = 80
smoothing = 1.5
# Intensité des surfaces de la courbe (0 à 1), mélangées en additif comme la lumière
# (rouge + vert = jaune, les trois = blanc).
fill_strength = 0.55
# Statistiques du grand histogramme (Maj+E) : plage des ombres aux hautes lumières, sans
# les pixels isolés (0,01 : centiles 1 % et 99 %).
stats_tail = 0.01
# Grand histogramme : diamètre des pastilles de canal (rouge, vert, bleu, blanc = tous ;
# Maj+C les fait tourner) ; photo d'analyse (en gris, zones saturées / bouchées en
# analysis_over / analysis_under, du canal choisi) affichée à l'ouverture, à droite de
# l'histogramme et à sa hauteur (p ou l'icône de photo la montrent ou la masquent) ;
# éclaircissement de son fond par rapport à celui de la boîte (0 à 1).
channel_dot = 11.0
analysis = false
analysis_lighten = 0.06

[gui.sharpness]
# Carte de netteté (focus peaking), en vue ajustée comme en 1:1 : affichée au démarrage
# (p l'affiche ou la masque). Calcul : section [sharpness] ; son seuil suit le curseur de
# sévérité du flou.
visible = false
# Couleurs proposées, dans l'ordre de la rotation (Ctrl+P) : selon l'image, l'une ressort
# mieux que l'autre.
colors = ["#ff2828", "#28ff50", "#28b4ff"]
# Opacité des contours (0 à 1).
opacity = 1.0
# Pas de la sévérité au clavier (Ctrl+J plus souple, Ctrl+K plus strict), sur une échelle
# de -1 (tout à gauche) à 1 (tout à droite).
step = 0.1

[gui.metadata]
# Panneau des métadonnées, à droite : affiché au démarrage (Maj+M l'affiche ou le masque),
# largeur initiale (points, le bord se tire à la souris), histogramme de l'image
# sélectionnée en haut du panneau (grille et plein écran ; panneau masqué : sur l'image),
# et sa hauteur.
visible = true
width = 280.0
histogram = true
histogram_height = 120.0

[gui.colors]
# Couleurs "#rrggbb". Sélection (clic ou clavier) absente : couleur du thème. Exemple :
# selection = "#1e6f7f"
# Barres de progression de la barre d'état ; absent : gris discret du thème. Exemple :
# progress = "#3c3c3c"
# Cadre de la vignette survolée (le survol ne sélectionne pas).
hover = "#b4b4b4"
# Cadre des images sélectionnées (sélection multiple : Espace, v, Ctrl+A, Maj+clic…),
# distinct de l'image courante (fond plein) et du survol.
marked = "#ffaa28"
# Repère du collimateur de mise au point.
focus = "#3cff6e"
# Grilles intégrées des superpositions (tiers, nombre d'or, diagonales).
overlay = "#ffffff"
# Goutte des filtres de netteté (barrée : masquer les floues ; seule : floues seulement).
blur_drop = "#6eaae6"
# Piles actives : fond des images, un groupe sur deux en gris clair, l'autre en gris foncé
# (une photo isolée est un groupe d'une image).
stack_band = "#383838"
stack_band_alt = "#181818"
# Thème gris neutre (theme = "neutral", tons relevés sur darktable) : panneaux, fond
# central, cellules de la grille, champs de saisie, fonds des piles (un groupe sur
# deux, l'autre).
neutral_panel = "#2a2a2a"
neutral_center = "#5e5e5e"
neutral_cell = "#767676"
neutral_field = "#3e3e3e"
# Nom des images sur les cellules (sombre : lisible sur le gris des cellules).
neutral_cell_text = "#1e1e1e"
# Cellule sélectionnée, gris clair comme darktable (si selection n'est pas donnée).
neutral_selection = "#b3b3b3"
neutral_stack_band = "#848484"
neutral_stack_band_alt = "#6a6a6a"
# Piles repliées : feuilles derrière la couverture et pastille du nombre d'images.
stack_mark = "#8c8c8c"
# Badge « RAW » des cellules (absent : couleur d'accent du thème).
# badge = "#78aae6"
warning = "#e6a03c"
error = "#e65a5a"
view_background = "#0c0c0c"
# Fonds proposés tour à tour par Ctrl+L (grille et plein écran), après celui du thème ;
# une couleur égale à celle du thème ou déjà dans la liste est sautée.
backgrounds = ["#303030", "#000000", "#ffffff"]
# Notes : étoiles (absent : couleur d'accent du thème), pastilles accepté / rejeté,
# couleurs de notation.
# stars = "#f0c440"
accepted = "#46aa5a"
rejected = "#d74646"
red = "#e14141"
yellow = "#e6c832"
green = "#46b450"
blue = "#4182e1"
purple = "#a555d2"
# Histogramme (canaux). Zones et badges : saturé dans les trois canaux, saturé dans un seul
# canal (rouge, vert, bleu ; deux canaux : couleurs additionnées), bouché.
hist_red = "#eb4646"
hist_green = "#50c85a"
hist_blue = "#5082f0"
clip_over = "#ff28ff"
clip_red = "#ff3232"
clip_green = "#32e632"
clip_blue = "#3278ff"
clip_under = "#00d2ff"
# Image d'analyse du grand histogramme (en gris) : saturé, bouché ; des couleurs qui
# tranchent sur du gris.
analysis_over = "#ffdc00"
analysis_under = "#286eff"

[keys]
# Raccourcis, par identifiant d'action (liste dans l'aide, F1 ou ?, au survol d'une
# action). Les raccourcis cités REMPLACENT ceux des profils pour cette action ; liste vide :
# plus aucun. Une touche : "p", "Maj+P", "Ctrl+u", "Flèche gauche", "PageUp", "Échap" ;
# une majuscule seule vaut Maj + la lettre ("G", comme dans vim) ; une séquence : "g g" ;
# un caractère sans nom de touche : "°". Un raccourci attribué à deux actions est signalé
# au démarrage (barre d'état). Exemples :
# "core.flag.accept" = ["Maj+P", "a"]
# "core.nav.first" = ["Début", "g g"]
# "core.rate.color.purple" = ["°", ",", "."]
