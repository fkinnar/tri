# Fichier de configuration de tri : toutes les valeurs par défaut, commentées.
#
# Emplacement (lu par l'interface et par la ligne de commande) :
#   Linux    $XDG_CONFIG_HOME/tri/config.toml, sinon ~/.config/tri/config.toml
#   macOS    ~/Library/Application Support/tri/config.toml
#   Windows  %APPDATA%\tri\config.toml
# ou ailleurs avec --config FICHIER.
#
# Toute clé absente prend sa valeur par défaut : il suffit de copier les lignes à changer.
# Une clé inconnue (faute de frappe) est signalée au démarrage ; les valeurs par défaut
# sont alors utilisées pour tout le fichier. Un test vérifie que ce fichier reste égal aux
# valeurs du code. Voir doc/settings.md.

[preview]
# Côté long des vignettes de la grille (pixels).
thumbnail = 400
# Côté long de l'aperçu plein écran (pixels), ou "auto" : plus grand côté de l'écran
# principal (2560 sur un écran 2560×1440).
standard = "auto"
# Taille "auto" quand l'écran est inconnu (ligne de commande).
auto_fallback = 2560
# Rendu RAW de l'aperçu standard en demi-résolution (≈ 0,35 s au lieu de ≈ 3,8 s sur un RAF
# X-T4) si la moitié du côté long du RAW vaut au moins `half_size_margin` × `standard`.
# 1.0 : dès qu'elle couvre la taille ; plus grand : marge de netteté.
half_size_margin = 1.0
# Aperçu boîtier (JPEG embarqué) refusé s'il est plus petit que cette fraction de
# `standard` (certains boîtiers n'embarquent qu'une vignette de 160 px).
embedded_min_ratio = 0.5
# Plus petit JPEG embarqué accepté pour le 1:1 du JPEG boîtier (pixels, côté long).
min_embedded_full = 1024

[render]
# Développement RAW (LibRaw). Changer un réglage recalcule les rendus RAW concernés.
# Balance des blancs du boîtier (false : « lumière du jour »).
camera_wb = true
# Luminosité (1.0 = défaut LibRaw).
bright = 1.0
# Luminosité automatique de LibRaw : désactivée, elle « corrige » une sous-exposition
# qu'on cherche justement à voir en triant.
auto_bright = false

[cache]
# Dossier du cache. Absent : emplacement du système (~/.cache/tri, ~/Library/Caches/tri,
# %LOCALAPPDATA%\tri). Exemple :
# dir = "/mnt/ssd/cache-tri"
# Qualité JPEG des entrées (1 à 100). Les entrées déjà écrites sont gardées : vider le
# cache (tri --clear-cache) pour les réécrire.
jpeg_quality = 90
# Taille maximale de chaque niveau 1:1 (100 % RAW, 1:1 du JPEG boîtier), en Mo : au-delà,
# les moins récemment utilisés sont supprimés au démarrage (~5 Mo par 1:1 de 26 Mpx).
# 0 : pas de limite.
zoom_max_mb = 2000

[scheduler]
# Workers parallèles pour les vignettes et images plates, ou "auto" : moitié des cœurs.
# Les rendus RAW passent toujours par un seul worker (LibRaw est déjà multithreadé).
light_workers = "auto"
# Vignettes d'abord, puis aperçus boîtier, puis rendus RAW (false : tout mélangé).
thumbnails_first = true
# Analyser l'exposition de tout le dossier en fond (histogrammes, badges de la grille),
# après vignettes et aperçus boîtier ; false : seulement l'image affichée et ses voisines.
exposure = true

[xmp]
# Nom d'un NOUVEAU sidecar : "darktable" (IMAGE.RAF.xmp, un par fichier) ou "adobe"
# (IMAGE.xmp, Lightroom, Capture One, Bridge ; partagé par le RAF et le JPG d'une paire).
# Un sidecar existant est toujours réutilisé, le plus récent si les deux existent.
sidecar = "darktable"
# Plusieurs couleurs par image (comme darktable) ; false : une seule, une nouvelle couleur
# remplace la précédente (comme Lightroom).
multiple_colors = false

[places]
# Emplacements proposés par le panneau des dossiers. Masquer les sauvegardes Time Machine,
# reconnues à leur contenu (pas à leur nom) :
hide_backups = true
# Emplacements à masquer : motifs comparés au nom ou au chemin, sans tenir compte de la
# casse, avec * (n'importe quelle suite) et ? (un caractère). Exemple :
# exclude = ["Backup", "/mnt/*"]
exclude = []
# Volumes fixés : disques externes toujours branchés (travail, sauvegarde), sans bouton
# d'éjection pour éviter un accident ; mêmes motifs qu'exclude. Exemple :
# fixed = ["Work", "Backup"]
fixed = []
# Surveillance des volumes (ms) : un disque ou une carte branchés apparaissent d'eux-mêmes
# dans le panneau des dossiers ; 0 : pas de surveillance (F5 ou « Actualiser »).
watch_ms = 2000

[exposure]
# Histogramme et alertes d'exposition, calculés sur les données du capteur pour un RAW.
# Seuil de saturation en IL sous le blanc du capteur (0 : seulement au blanc). -0.02 (1,4 %)
# par défaut : un RAF X-T4 enregistre un rouge ou un bleu saturé un peu sous le blanc vers
# les bords de l'image (correction de vignetage du boîtier).
over_ev = -0.02
# Seuil des ombres bouchées, en IL sous le blanc (-10 : moins de 1/1024 de la plage).
under_ev = -10.0
# Cases de l'histogramme linéaire.
linear_bins = 1024
# Étendue de l'histogramme en IL sous la saturation, et cases par IL.
ev_range = 16.0
ev_bins_per_stop = 8
# Côté long du masque des zones saturées / bouchées (cases).
mask_size = 1024
# Part des pixels d'une case qui doivent être bouchés pour la marquer (0 à 1) : pas
# tous, le bruit du capteur près du noir en remonte presque toujours un.
mask_under_share = 0.5

[offload]
# Déchargement d'une carte : dossier racine (~ accepté) du premier déchargement ; ensuite,
# la racine du dernier déchargement est retenue. Le dossier de la séance y est créé
# (proposé : AAAA-MM-JJ_, à compléter ou remplacer ; l'année va dans la racine).
destination = "~/Pictures"
# Relire chaque copie et comparer son empreinte à l'original.
verify = true
# Les doublons se jugent sur le dossier de destination (une copie identique déjà présente
# est ignorée) : une même carte peut être déchargée à deux endroits. true : ignorer aussi ce
# qui a déjà été déchargé n'importe où (historique global).
skip_known = false
# Fichier de l'historique des déchargements (~ accepté) ; vide : offload-history.tsv dans le
# dossier de données (Linux ~/.local/share/tri, macOS ~/Library/Application Support/tri,
# Windows %APPDATA%\tri).
history = ""
# Choix par défaut de la boîte de déchargement (cochés ou non) : ne copier que les RAW
# (JPEG du boîtier laissés sur la carte) ; à la fin, ouvrir le dossier de la séance,
# éjecter la carte, supprimer de la carte les fichiers copiés et vérifiés. En ligne de
# commande, éjection et suppression demandent une option explicite (--eject,
# --delete-copied).
raw_only = false
open_after = true
eject_after = true
delete_after = false

[data]
# Dossier des données (historique des déchargements, dernier dossier ouvert). Absent :
# Linux ~/.local/share/tri, macOS ~/Library/Application Support/tri, Windows %APPDATA%\tri.
# Exemple :
# dir = "/chemin/vers/données"

[gui]
# "dark", "light" ou "system".
theme = "dark"
# Profils de raccourcis actifs, "classic" (flèches) et/ou "vim" (hjkl) ; le premier
# l'emporte en cas de conflit.
keys = ["classic", "vim"]
# Délai maximal entre deux touches d'une séquence (ms), comme le timeoutlen de vim : « gg »
# (première image, profil vim) doit être tapé dans ce délai.
key_sequence_timeout_ms = 1000
# Taille initiale de la fenêtre (points).
window = [1400.0, 900.0]
# Rendus RAW : "on-demand" (image affichée et voisines, en mode RAW seulement) ou
# "background" (tout le dossier, après vignettes et aperçus boîtier).
raw_previews = "on-demand"
# Temps maximal de chargement des vignettes par image affichée (ms) : au-delà, la suite
# attend l'image suivante, pour ne pas figer l'interface.
load_budget_ms = 8
# Barre de filtres (type, étoiles, drapeau, couleurs) affichée au démarrage ; Maj+F
# l'affiche ou la masque.
filter_bar = true
# Sans dossier en argument, rouvrir le dernier dossier ouvert (mémorisé dans le dossier de
# données : ~/.local/share/tri, ~/Library/Application Support/tri, %APPDATA%\tri).
reopen_last = true
# Bandeau de notation à la souris (drapeaux, étoiles, couleurs de l'image sélectionnée)
# affiché au démarrage ; Maj+N l'affiche ou le masque. Le clic droit sur une image ouvre
# une boîte avec les mêmes contrôles.
rating_bar = true

[gui.grid]
# Dimensions en points.
cell = 200.0
gap = 8.0
# Hauteur réservée au nom du fichier sous la vignette.
label = 18.0
# Marge intérieure de la cellule.
padding = 6.0
# Longueur maximale du nom affiché (caractères).
name_chars = 24
# Vignettes gardées en mémoire graphique au plus.
textures = 600
# Taille des notes (étoiles, couleurs, drapeau) sur les vignettes.
marks = 12.0
# Opacité de la vignette d'une photo rejetée (0 : invisible, 1 : normale).
rejected_opacity = 0.35
# Épaisseur du cadre de la vignette survolée par la souris.
hover_frame = 2.0

[gui.view]
# Attente sur une image avant de lancer son 100 % RAW (ms) : les images seulement
# traversées en enchaînant les flèches ne lancent pas un calcul de plusieurs secondes.
full_raw_dwell_ms = 400
# Grandes textures (aperçus, 1:1) gardées en mémoire graphique ; un 1:1 de 26 Mpx occupe
# ~100 Mo.
textures = 8
# Déplacement d'une image zoomée par appui (Maj + flèches, Maj + hjkl), en fraction de la
# vue.
pan_step = 0.2
# Taille des notes (étoiles, couleurs, drapeau) en plein écran.
marks = 18.0

[gui.folders]
# Panneau des dossiers, à gauche de la grille : affiché au démarrage (Maj+D l'affiche ou le
# masque), largeur initiale (points, le bord se tire à la souris), retrait par niveau,
# dossiers cachés (.xxx) montrés ou non.
visible = true
width = 240.0
indent = 14.0
hidden = false

[gui.histogram]
# Histogramme du plein écran (données du capteur pour un RAW) : affiché au démarrage
# (touche i), échelle "ev" (IL sous la saturation) ou "linear" (Maj+I bascule), taille
# en points (indicateurs compris), IL montrés en échelle IL.
visible = true
scale = "ev"
width = 320.0
height = 130.0
ev_shown = 12.0
# Zones saturées et bouchées superposées à l'image au démarrage (touche o), et leur
# opacité. Zones saturées colorées par canal (clip_red / clip_green / clip_blue, mélangées
# si deux canaux, clip_over si les trois) ; false : clip_over pour toute saturation.
clipping = false
clipping_opacity = 0.7
clipping_channels = true
# Badges de la grille : part des pixels saturés / bouchés (canal le plus touché, 0 à 1)
# au-delà de laquelle une vignette est signalée.
badge_over = 0.005
badge_under = 0.05

[gui.metadata]
# Panneau des métadonnées, à droite : affiché au démarrage (Maj+M l'affiche ou le masque),
# largeur initiale (points, le bord se tire à la souris), histogramme de l'image
# sélectionnée dans le panneau en grille, et sa hauteur.
visible = true
width = 280.0
histogram = true
histogram_height = 120.0

[gui.colors]
# Couleurs "#rrggbb". Sélection (clic ou clavier) absente : couleur du thème. Exemple :
# selection = "#1e6f7f"
# Barres de progression de la barre d'état ; absent : gris discret du thème. Exemple :
# progress = "#3c3c3c"
# Cadre de la vignette survolée (le survol ne sélectionne pas).
hover = "#b4b4b4"
badge = "#78aae6"
warning = "#e6a03c"
error = "#e65a5a"
view_background = "#0c0c0c"
# Notes : étoiles, pastilles accepté / rejeté, couleurs de notation.
stars = "#f0c440"
accepted = "#46aa5a"
rejected = "#d74646"
red = "#e14141"
yellow = "#e6c832"
green = "#46b450"
blue = "#4182e1"
purple = "#a555d2"
# Histogramme (canaux). Zones et badges : saturé dans les trois canaux, saturé dans un seul
# canal (rouge, vert, bleu ; deux canaux : couleurs additionnées), bouché.
hist_red = "#eb4646"
hist_green = "#50c85a"
hist_blue = "#5082f0"
clip_over = "#ff28ff"
clip_red = "#ff3232"
clip_green = "#32e632"
clip_blue = "#3278ff"
clip_under = "#00d2ff"

[keys]
# Raccourcis, par identifiant d'action (liste dans l'aide, F1 ou ?, au survol d'une
# action). Les raccourcis cités REMPLACENT ceux des profils pour cette action ; liste vide :
# plus aucun. Une touche : "p", "Maj+P", "Ctrl+u", "Flèche gauche", "PageUp", "Échap" ;
# une majuscule seule vaut Maj + la lettre ("G", comme dans vim) ; une séquence : "g g" ;
# un caractère sans nom de touche : "°". Un raccourci attribué à deux actions est signalé
# au démarrage (barre d'état). Exemples :
# "core.flag.accept" = ["Maj+P", "a"]
# "core.nav.first" = ["Début", "g g"]
# "core.rate.color.purple" = ["°", ",", "."]
