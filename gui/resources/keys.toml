# macOS F11 shows the desktop.
"core.view.focus_mode" = ["F11", "Ctrl+Shift+f"]
# "q q": "q" alone quit too quickly (issue #244).
"core.app.quit" = ["q q"]
"core.app.check_update" = []
"core.app.settings" = ["Ctrl+,"]
# Zoom steps, like Lightroom: characters, for the top row as well as the numeric
