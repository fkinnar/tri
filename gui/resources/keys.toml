[after_leader]
# Keys typed after the leader (Ctrl+b by default), in both profiles.
# Panels: go to the one on the left / right (h / l, or the arrows), or the next one
# (o); show / hide the one in that direction with Shift (H / L / K / J, or Shift +
# arrows): folders on the left, metadata on the right, filters at the top, rating at
# the bottom.
"core.panel.left" = ["h", "Left"]
"core.panel.right" = ["l", "Right"]
"core.panel.next" = ["o"]
"core.view.folders" = ["Shift+h", "Shift+Left"]
"core.view.metadata" = ["Shift+l", "Shift+Right"]
"core.view.filter_bar" = ["Shift+k", "Shift+Up"]
"core.view.rating_bar" = ["Shift+j", "Shift+Down"]
# Space: auto-advance after a rating.
"core.rate.auto_advance" = ["Space"]
# ?: report a problem (prefilled GitHub form), next to the help.
"core.app.report_issue" = ["?", "Shift+?"]
# r: develop. r again: with the image's software; Shift+R: the whole folder, in the
# background; d, p, t, a: with darktable, RapidRAW, RawTherapee, ART. In the folder
# panel, the same keys open the folder in that software.
"core.develop.render" = ["r r"]
"core.develop.folder" = ["r Shift+r"]
