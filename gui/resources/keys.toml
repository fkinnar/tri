# Default keyboard shortcuts of tri.
#
# Read at startup from next to the program:
# - macOS: tri.app/Contents/Resources/keys.toml;
# - Linux: share/tri/keys.toml in the folder of tri (/opt/tri/share/tri with the .deb,
#   ~/.local/lib/tri/share/tri with install.sh, usr/share/tri in the AppImage);
# - Windows: next to tri.exe.
# If it is missing, the copy built into the program is used. If it cannot be read, the
# copy is used too, and the problem shows in the status bar.
#
# To change a shortcut for yourself, do not edit this file: an update replaces it. Use
# the [keys] section of your configuration file (Ctrl+, then "Shortcuts"). It uses the
# same syntax, and the actions it names replace the shortcuts given here.
#
# Syntax: "action id" = ["shortcut", ...]. Every action of tri is listed, an empty list
# [] for those without a default shortcut.
# - A shortcut is one key, with modifiers: "z", "Shift+p", "Ctrl+Shift+c", "F2",
#   "Left", "PageDown", "Escape", "Enter", "Space", "Delete", "Backspace", "Tab".
#   Letters are written in lower case; an upper-case letter means Shift + that letter.
# - A sequence is several keys separated by spaces: "g g", "f 3", "f Escape".
# - A character can stand for a key the keyboard layout moves around: "°", "(", ")",
#   "+", "-", "*", "/", "=", ":", "?", ",", ".".
# - Cmd and Alt are left to the system. On macOS, Cmd+Z, Cmd+Shift+Z and Cmd+C also act
#   as Ctrl+Z, Ctrl+Shift+Z and Ctrl+C.
#
# Sections add up: [common] applies to both profiles, then [classic] or [vim] according
# to [gui] profile. [after_leader] lists the keys typed after the panel prefix ("leader"
# below), in both profiles.
#
# How the keys are chosen (shortcut review of 2026-11-06, issue #280):
# - one letter per domain, from its English name: i histogram, m magnify, n order,
#   o overlays, p peaking, r render, s stacks, t text infos, v versions…;
# - the letter alone: the main action; Shift + the letter: its variant; Ctrl + the
#   letter: the settings window of the domain;
# - a setting changed now and then: <leader>, the letter of the domain, then the
#   setting ("<leader> i s": histogram scale);
# - except for everybody's reflexes: Ctrl+Z, Ctrl+C, Ctrl+X, Ctrl+A, Ctrl+F, Ctrl+E,
#   Ctrl+, keep their usual meaning.
#
# Panel keys (folders, metadata, large histogram, crop) only act while that panel has
# the keyboard; there, they take precedence over the general shortcuts. A sequence
# starting with the leader reaches them from anywhere.

# Panel prefix, like the prefix of tmux: then the keys of [after_leader]. It must not
# be bound to anything else (it is refused, and the reason shown, if it is). Can be
# replaced for yourself with [gui] leader in the configuration file.
leader = "Ctrl+b"

# Loupe: while this key is held, the image at 100 % under the pointer (fit view and
# comparison). A key, or "shift", "ctrl", "alt"; "none": no loupe. It must not be bound
# to anything else. Can be replaced for yourself with [gui.zoom] loupe_key.
loupe = "m"

