# Default keyboard shortcuts of tri.
#
# Read at startup from next to the program:
# - macOS: tri.app/Contents/Resources/keys.toml;
# - Linux: share/tri/keys.toml in the folder of tri (/opt/tri/share/tri with the .deb,
#   ~/.local/lib/tri/share/tri with install.sh, usr/share/tri in the AppImage);
# - Windows: next to tri.exe.
# If it is missing, the copy built into the program is used. If it cannot be read, the
# copy is used too, and the problem shows in the status bar.
#
# To change a shortcut for yourself, do not edit this file: an update replaces it. Use
# the [keys] section of your configuration file (Ctrl+, then "Shortcuts"). It uses the
# same syntax, and the actions it names replace the shortcuts given here.
#
# Syntax: "action id" = ["shortcut", ...]. Every action of tri is listed, an empty list
# [] for those without a default shortcut.
# - A shortcut is one key, with modifiers: "z", "Shift+p", "Ctrl+Shift+c", "F2",
#   "Left", "PageDown", "Escape", "Enter", "Space", "Delete", "Backspace", "Tab".
#   Letters are written in lower case; an upper-case letter means Shift + that letter.
# - A sequence is several keys separated by spaces: "g g", "f 3", "f Escape".
# - A character can stand for a key the keyboard layout moves around: "°", "(", ")",
#   "+", "-", "*", "/", "?", ",", ".".
# - Cmd and Alt are left to the system. On macOS, Cmd+Z, Cmd+Shift+Z and Cmd+C also act
#   as Ctrl+Z, Ctrl+Shift+Z and Ctrl+C.
#
# Sections add up: [common] applies to both profiles. [classic] and [vim] are added
# according to [gui] profile ("classic", "vim" or "both"). [after_leader] lists the
# keys typed after the panel prefix, "leader" below.
#
# Panel keys (folders, metadata, large histogram, crop) only act while that panel has
# the keyboard. There, they take precedence over the general shortcuts.

# Panel prefix, like the prefix of tmux: then the keys of [after_leader] (h / l for the
# panel on the left / right, o for the next one…). The panel that has the keyboard handles its
# keys first; Escape gives the keyboard back to the images. Can be replaced for yourself
# with [gui] leader in the configuration file.
leader = "Ctrl+b"

[common]

# --- Basics ---
"core.view.open" = ["Enter"]
"core.view.zoom" = ["z"]
"core.view.source" = ["b"]
"core.view.back" = ["Escape"]
# "?" comes with or without Shift depending on the keyboard layout.
"core.app.help" = ["F1", "?", "Shift+?"]
# Search: Ctrl+F everywhere. "/" also works in the grid and in the folder panel; in
# full screen, "/" stays "fit".
"core.search" = ["Ctrl+f"]
# Focus mode: F11, as for full-screen applications. Also Ctrl+Shift+F, because on
# macOS F11 shows the desktop.
"core.view.focus_mode" = ["F11", "Ctrl+Shift+f"]
# Develop in the development software: on request only (it takes a few seconds).
"core.develop.render" = ["Shift+b"]
# The whole folder, in the background (issue #69).
"core.develop.folder" = ["Ctrl+Shift+b"]
# "q q": "q" alone quit too quickly, next to Shift+Q (issue #244).
"core.app.quit" = ["q q"]
"core.app.check_update" = []

# --- Rating ---
# Designed for AZERTY keyboards too: digits with or without Shift (top row of an
# AZERTY with Shift, numeric keypad without). Purple on "°" (AZERTY), "," and "." (the
# keypad decimal separator depends on the system). Flags on Shift+P / X / U ("u" alone
# is kept for undo).
"core.rate.star.0" = ["0", "Shift+0"]
"core.rate.star.1" = ["1", "Shift+1"]
"core.rate.star.2" = ["2", "Shift+2"]
"core.rate.star.3" = ["3", "Shift+3"]
"core.rate.star.4" = ["4", "Shift+4"]
"core.rate.star.5" = ["5", "Shift+5"]
"core.rate.color.red" = ["6", "Shift+6"]
"core.rate.color.yellow" = ["7", "Shift+7"]
"core.rate.color.green" = ["8", "Shift+8"]
"core.rate.color.blue" = ["9", "Shift+9"]
# Keypad decimal separator: "," on macOS, "." on Linux Mint.
"core.rate.color.purple" = ["°", ",", "."]
"core.flag.accept" = ["Shift+p"]
"core.flag.reject" = ["Shift+x"]
"core.flag.none" = ["Shift+u"]
"core.rate.auto_advance" = ["Shift+a"]
"core.view.rating_bar" = ["Shift+n"]
"core.view.image_info" = ["Ctrl+i"]
# "L" like the lights of Lightroom.
"core.view.background" = ["Ctrl+l"]
# Thumbnail infos ("text"): name, format, ratings, badges.
"core.view.grid_info" = ["Shift+t"]
"core.view.folders" = ["Shift+d"]
"core.view.refresh_folders" = ["F5"]
"core.view.histogram" = ["i"]
"core.view.histogram_scale" = ["Shift+i"]
"core.view.histogram_large" = ["Shift+e"]
"core.view.histogram_channel" = ["Shift+c"]
# Clipped / blocked areas: "w" for warnings ("o" is for the overlays, like Lightroom).
"core.view.clipping" = ["w"]
"core.view.peaking" = ["p"]
"core.view.peaking_color" = ["Ctrl+p"]
# Sharpness strictness (slider, map and judgement): Ctrl+J more lenient, Ctrl+K
# stricter, like down / up in vim (Ctrl + arrows belong to the system).
"core.view.sharpness_lenient" = ["Ctrl+j"]
"core.view.sharpness_strict" = ["Ctrl+k"]
"core.view.focus_point" = ["m"]
# Overlays, like Lightroom: "o" the next one (grids, then the user's own), Shift+O
# turns the spiral (and the other lines).
"core.view.overlay" = ["o"]
"core.view.overlay_orient" = ["Shift+o"]
"core.view.metadata" = ["Shift+m"]

# --- Filters ---
# Prefix "f", followed by the matching rating key. "f f" changes the file type,
# "f Escape" clears everything.
"core.filter.cycle" = ["f f"]
"core.filter.stars.0" = ["f 0", "f Shift+0"]
"core.filter.stars.1" = ["f 1", "f Shift+1"]
"core.filter.stars.2" = ["f 2", "f Shift+2"]
"core.filter.stars.3" = ["f 3", "f Shift+3"]
"core.filter.stars.4" = ["f 4", "f Shift+4"]
"core.filter.stars.5" = ["f 5", "f Shift+5"]
# Comparison: at least, exactly, at most (issue #165).
"core.filter.stars.op" = ["f Equals"]
"core.filter.flag.accepted" = ["f p", "f Shift+p"]
"core.filter.flag.not_rejected" = ["f u", "f Shift+u"]
"core.filter.flag.rejected" = ["f x", "f Shift+x"]
"core.filter.color.red" = ["f 6", "f Shift+6"]
"core.filter.color.yellow" = ["f 7", "f Shift+7"]
"core.filter.color.green" = ["f 8", "f Shift+8"]
"core.filter.color.blue" = ["f 9", "f Shift+9"]
"core.filter.color.purple" = ["f °", "f ,", "f ."]
"core.filter.clear" = ["f Escape"]
"core.filter.blurry" = ["f b"]
# Well exposed: "w" like the exposure warnings. Invert: "i".
"core.filter.well_exposed" = ["f w"]
# Current stack only (issue #52).
"core.filter.stack" = ["f c"]
"core.filter.invert" = ["f i"]
# Order: "s" next sort, "r" reverse.
"core.filter.sort" = ["f s"]
"core.filter.sort_reverse" = ["f r"]
# Thumbnail render ("developed", issue #114).
"core.grid.render" = ["f d"]
# Developed: Shift+D, next to the thumbnail render.
"core.filter.developed" = ["f Shift+d"]
"core.view.filter_bar" = ["Shift+f"]

# --- Selection ---
# Everything with the keyboard; "v" like the visual mode of vim. Escape also clears
# the selection.
"core.select.toggle" = ["Space"]
"core.select.visual" = ["v"]
"core.view.compare" = ["c"]
"core.select.all" = ["Ctrl+a"]
"core.select.clear" = ["Ctrl+Shift+a"]

# --- Files ---
# Delete: Delete, or the "delete" key of Mac keyboards (Backspace); a confirmation
# always follows.
"core.file.rename" = ["F2"]
"core.file.delete" = ["Delete", "Backspace"]
# The photo with all its developments: Ctrl as well. Without developments, Delete is
# enough (same dialog).
"core.file.delete_photo" = ["Ctrl+Delete", "Ctrl+Backspace"]
"core.file.reveal" = ["Shift+r"]
"core.file.edit" = ["e"]
# Like most applications (Cmd+, on macOS is taken by the system).
"core.app.settings" = ["Ctrl+,"]
# Move: Ctrl+X, like "cut".
"core.file.move" = ["Ctrl+x"]
# Export: Ctrl+E, like Lightroom.
"core.file.export" = ["Ctrl+e"]
# Export report: Ctrl+Shift+E, next to the export.
"core.file.export.report" = ["Ctrl+Shift+e"]
# Crop: "r", like Lightroom (full screen; from the grid, opens it).
"core.view.crop" = ["r"]
# Versions of the image: "n", the original then each version.
"core.view.version_next" = ["n"]
# Undo / redo: Ctrl+Z / Ctrl+Shift+Z in both profiles (Cmd+Z / Cmd+Shift+Z on macOS
# too), everybody's reflex.
"core.edit.undo" = ["Ctrl+z"]
"core.edit.redo" = ["Ctrl+Shift+z"]
"core.edit.history" = ["Ctrl+h"]
# Stacks: "s" expands / collapses the image's stack, Shift+S all of them; Ctrl+G the
# grouping window.
"core.stack.toggle" = ["s"]
"core.stack.all" = ["Shift+s"]
"core.stack.settings" = ["Ctrl+g"]
# Developments of a photo: Shift+W / Shift+Q the next / previous one (grid and full
# screen). They fold with the stack keys: "core.dev.toggle" and "core.dev.fold_all"
# have no default key (they can be set in [keys]).
"core.dev.next" = ["Shift+w"]
"core.dev.prev" = ["Shift+q"]
"core.dev.toggle" = []
"core.dev.fold_all" = []
# Write the missing rating sidecars (one software, or all of them).
"core.file.sidecars" = []
# Send by AirDrop (macOS).
"plugin.airdrop.send" = []
# Zoom steps, like Lightroom: characters, for the top row as well as the numeric
# keypad, whatever the keyboard layout.
"core.view.zoom_in" = ["+"]
"core.view.zoom_out" = ["-"]
"core.view.zoom_100" = ["*"]
"core.view.zoom_fit" = ["/"]
# Stack mode (full screen). The favourite of the stack: Shift+Enter (Enter as well in
# stack mode, in full screen).
"core.stack.mode" = ["Ctrl+s"]
# "( (" opens a level (burst, then developments), ") )" closes it. Characters: direct
# on AZERTY, Shift+9 / Shift+0 on QWERTY. Never "[" "]" nor "{" "}" (Alt+Shift on
# macOS).
"core.stack.open" = ["( ("]
"core.stack.close" = [") )"]
"core.stack.choose" = ["Shift+Enter"]
# On entering a stack: the cover or the first photo (button of the bottom bar).
"core.stack.enter" = ["Ctrl+Shift+s"]

# --- Folder panel (when it has the keyboard) ---
# Moving: arrows or hjkl, depending on the profile.
"core.folders.open" = ["Enter"]
# Removable drive under the cursor: offload, eject (a dialog confirms).
"core.folders.offload" = ["o"]
"core.folders.eject" = ["e"]
# Like nvim-tree: "a" creates, "r" renames; delete: Delete (and "x" in vim). A dialog
# always confirms.
"core.folders.create" = ["a"]
"core.folders.rename" = ["r", "F2"]
"core.folders.delete" = ["Delete", "Backspace"]
# Favourite: "m" (mark), like the bookmarks of nvim-tree.
"core.folders.favorite" = ["m"]
# Name the favourite: "n".
"core.folders.favorite_name" = ["n"]
# Connect to a network share: "c" (connect); forget it: Shift+C.
"core.folders.connect" = ["c"]
"core.folders.forget" = ["Shift+c"]
# Open the folder in darktable: "d", like developing the images.
"plugin.darktable.open_folder" = ["d"]
"plugin.rawtherapee.open_folder" = []
"plugin.art.open_folder" = []
# Copy / move the folder to…: like for the images (Ctrl+C or "y", Ctrl+X); the dialog
# can switch from one to the other.
"core.folders.move" = ["Ctrl+x"]

# --- Metadata panel (when it has the keyboard) ---
# Copy like everywhere else (Cmd+C on macOS).
"core.metadata.copy" = ["Ctrl+c"]
"core.metadata.open" = ["Enter"]
"core.metadata.activate" = ["Space"]

# --- Large histogram (when open) ---
# r, g, b: one channel; a: all of them.
"core.histogram.red" = ["r"]
"core.histogram.green" = ["g"]
"core.histogram.blue" = ["b"]
"core.histogram.all" = ["a"]
# l: the luminance.
"core.histogram.luminance" = ["l"]
# p: the analysis photo (areas on the image in grey), to the right of the histogram.
"core.histogram.photo" = ["p"]
# j: the curve of the camera JPEG, over the RAW data.
"core.histogram.camera" = ["j"]

# --- Crop ---
# Digits for the ratio (with or without Shift, for AZERTY), "x" for the orientation
# (like Lightroom), Enter to save.
"core.crop.ratio.free" = ["1", "Shift+1"]
"core.crop.ratio.original" = ["2", "Shift+2"]
"core.crop.ratio.square" = ["3", "Shift+3"]
"core.crop.ratio.5_4" = ["4", "Shift+4"]
"core.crop.ratio.3_2" = ["5", "Shift+5"]
"core.crop.ratio.16_9" = ["6", "Shift+6"]
"core.crop.ratio.4_3" = ["7", "Shift+7"]
"core.crop.rotate" = ["x"]
"core.crop.save" = ["Enter"]
# Presets: Tab / Shift+Tab ("p" was also the sharpness map, which stayed on during the
# crop).
"core.crop.preset" = ["Tab"]
"core.crop.preset_prev" = ["Shift+Tab"]

[classic]

# --- Classic profile ---
# Arrows, Home / End, Page Up / Page Down; Shift + arrows in a zoomed image.
"core.nav.prev" = ["Left"]
"core.nav.next" = ["Right"]
"core.nav.up" = ["Up"]
"core.nav.down" = ["Down"]
"core.nav.first" = ["Home"]
"core.nav.last" = ["End"]
# Start / end of the stack (issue #62): Shift as well, Home / End staying the folder.
"core.stack.first" = ["Shift+Home"]
"core.stack.last" = ["Shift+End"]
"core.nav.page_up" = ["PageUp"]
"core.nav.page_down" = ["PageDown"]
"core.view.pan_left" = ["Shift+Left"]
"core.view.pan_right" = ["Shift+Right"]
"core.view.pan_up" = ["Shift+Up"]
"core.view.pan_down" = ["Shift+Down"]
# Crop: arrows move the frame, Shift resizes it (right side / bottom).
"core.crop.move.left" = ["Left"]
"core.crop.move.right" = ["Right"]
"core.crop.move.up" = ["Up"]
"core.crop.move.down" = ["Down"]
"core.crop.size.left" = ["Shift+Left"]
"core.crop.size.right" = ["Shift+Right"]
"core.crop.size.up" = ["Shift+Up"]
"core.crop.size.down" = ["Shift+Down"]
# Copy / move to…: Ctrl+C / Ctrl+X, like copy / cut in a file manager (Cmd+C on
# macOS).
"core.file.copy" = ["Ctrl+c"]
"core.folders.copy" = ["Ctrl+c"]
# The whole stack: Shift as well (the trash is confirmed, as always).
"core.file.copy_stack" = ["Ctrl+Shift+c"]
"core.file.delete_stack" = ["Shift+Delete"]
"core.edit.redo" = ["Ctrl+y"]
# Folder panel.
"core.folders.up" = ["Up"]
"core.folders.down" = ["Down"]
"core.folders.expand" = ["Right"]
"core.folders.collapse" = ["Left"]
"core.folders.first" = ["Home"]
"core.folders.last" = ["End"]
# Metadata panel: Shift + arrows extend the selection.
"core.metadata.up" = ["Up"]
"core.metadata.down" = ["Down"]
"core.metadata.select_up" = ["Shift+Up"]
"core.metadata.select_down" = ["Shift+Down"]
"core.metadata.copy_all" = ["Ctrl+Shift+c"]
# Settings of the right panel: Left / Right change the setting under the cursor; Tab /
# Shift+Tab go from one section to the next (in the folder panel too).
"core.metadata.left" = ["Left"]
"core.metadata.right" = ["Right"]
"core.metadata.section_next" = ["Tab"]
"core.metadata.section_prev" = ["Shift+Tab"]
"core.folders.section_next" = ["Tab"]
"core.folders.section_prev" = ["Shift+Tab"]

[vim]

# --- Vim profile ---
# hjkl, g g / G, Ctrl+U / Ctrl+D; Shift + hjkl in a zoomed image; "u" undoes, like in
# vim.
"core.nav.prev" = ["h"]
"core.nav.next" = ["l"]
"core.nav.up" = ["k"]
"core.nav.down" = ["j"]
"core.nav.first" = ["g g"]
"core.nav.last" = ["Shift+g"]
"core.nav.page_up" = ["Ctrl+u"]
"core.nav.page_down" = ["Ctrl+d"]
"core.view.pan_left" = ["Shift+h"]
"core.view.pan_right" = ["Shift+l"]
"core.view.pan_up" = ["Shift+k"]
"core.view.pan_down" = ["Shift+j"]
# Crop: hjkl move the frame, Shift resizes it (right side / bottom).
"core.crop.move.left" = ["h"]
"core.crop.move.right" = ["l"]
"core.crop.move.up" = ["k"]
"core.crop.move.down" = ["j"]
"core.crop.size.left" = ["Shift+h"]
"core.crop.size.right" = ["Shift+l"]
"core.crop.size.up" = ["Shift+k"]
"core.crop.size.down" = ["Shift+j"]
# "y" copies (yank), "x" deletes (deletes the character: here the image; a
# confirmation follows). The stack is a sentence (issue #62): "(" / ")" its start and
# end, "d )" / "y )" the whole stack ("[" / "]" ruled out: Alt+Shift on AZERTY on
# macOS). Characters rather than keys: direct on AZERTY, Shift+9 / Shift+0 on QWERTY.
# "y" alone waits a short moment for what follows ([gui] key_ambiguous_timeout_ms).
"core.file.copy" = ["y"]
"core.file.copy_stack" = ["y )"]
"core.file.delete_stack" = ["d )"]
# "d d": the whole photo, with its developments.
"core.file.delete_photo" = ["d d"]
"core.stack.first" = ["("]
"core.stack.last" = [")"]
"core.file.delete" = ["x"]
"core.edit.undo" = ["u"]
"core.edit.redo" = ["Ctrl+r"]
# Folder panel, like nvim-tree.
"core.folders.up" = ["k"]
"core.folders.down" = ["j"]
"core.folders.expand" = ["l"]
"core.folders.collapse" = ["h"]
"core.folders.first" = ["g g"]
"core.folders.last" = ["Shift+g"]
"core.folders.delete" = ["x"]
"core.folders.copy" = ["y"]
# Metadata panel: "y" copies, Shift + j / k extend the selection, Shift+Y copies
# everything.
"core.metadata.up" = ["k"]
"core.metadata.down" = ["j"]
"core.metadata.copy" = ["y"]
"core.metadata.select_up" = ["Shift+k"]
"core.metadata.select_down" = ["Shift+j"]
"core.metadata.copy_all" = ["Shift+y"]
# Settings of the right panel: h / l change the setting under the cursor; "(" / ")" go
# from one section to the next, like from sentence to sentence (in the folder panel
# too).
"core.metadata.left" = ["h"]
"core.metadata.right" = ["l"]
"core.metadata.section_next" = [")"]
"core.metadata.section_prev" = ["("]
"core.folders.section_next" = [")"]
"core.folders.section_prev" = ["("]

[after_leader]
# After the panel prefix ([gui] leader, Ctrl+b by default): h / Left the panel on the
# left, l / Right the one on the right, o the next one; b to report a problem (bug);
# r, d, p to develop (the image's software, darktable, RapidRAW).
"core.panel.left" = ["h", "Left"]
"core.panel.right" = ["l", "Right"]
"core.panel.next" = ["o"]
"core.app.report_issue" = ["b"]
"core.develop.render" = ["r"]
"plugin.darktable.develop" = ["d"]
"plugin.rapidraw.develop" = ["p"]
"plugin.rawtherapee.develop" = []
"plugin.art.develop" = []
