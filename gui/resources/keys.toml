# i: the histogram. s: the scale (EV / linear); c: the next channel; r, g, b, a, l:
# red, green, blue, all, luminance.
"core.view.histogram_scale" = ["i s"]
"core.view.histogram_channel" = ["i c"]
"core.histogram.red" = ["i r"]
"core.histogram.green" = ["i g"]
"core.histogram.blue" = ["i b"]
"core.histogram.all" = ["i a"]
