[package]
name = "tri-gui"
version = "1.0.0-beta.1"
edition = "2024"
description = "Interface graphique (egui) de tri, visionneuse RAW"
license = "GPL-3.0-or-later"
repository = "https://github.com/fkinnar/tri"

[[bin]]
name = "tri-gui"
path = "src/main.rs"

[dependencies]
tri = { path = "..", default-features = false }
# Heure locale des dates affichées (déjà tiré par `trash` ; MIT OR Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
# Profils ICC de l'écran (`display`) ; déjà la bibliothèque des couleurs du moteur.
moxcms = "0.8"
# Fenêtre native de choix de fichier (« Parcourir… », 04/11/2026) : NSOpenPanel sur
# macOS, portail XDG sous Linux (libdbus chargée à l'exécution), boîte de Windows. MIT.
rfd = "0.17.2"

# macOS : espace couleur de la fenêtre déclaré au système (`display`, 11/11/2026) ;
# mêmes crates que wgpu (projet objc2, MIT / Apache-2.0 / Zlib), aucune nouvelle source.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-graphics"] }

# Linux : profil de l'écran publié par colord (propriété X11 `_ICC_PROFILE`, `display`) ;
# déjà présent par winit, en pur Rust ici (aucune bibliothèque X chargée). MIT / Apache-2.0.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", default-features = false }

# Windows : profil de l'écran de la fenêtre (`GetICMProfileW`, `display`) ; déjà présent
# par winit (Microsoft, MIT / Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem"] }

[features]
# Mêmes features que le moteur, transmises telles quelles.
default = ["heif", "turbojpeg"]
heif = ["tri/heif"]
turbojpeg = ["tri/turbojpeg"]

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"
