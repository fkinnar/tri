[package]
name = "tri-gui"
version = "1.0.0-alpha.7"
edition = "2024"
description = "Interface graphique (egui) de tri, visionneuse RAW"
license = "GPL-3.0-or-later"
repository = "https://github.com/fkinnar/tri"

[[bin]]
name = "tri-gui"
path = "src/main.rs"

[dependencies]
tri = { path = "..", default-features = false }
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
# Fenêtre native de choix de fichier (« Parcourir… », 04/11/2026) : NSOpenPanel sur
# macOS, portail XDG sous Linux (libdbus chargée à l'exécution), boîte de Windows. MIT.
rfd = "0.17.2"

[features]
# Mêmes features que le moteur, transmises telles quelles.
default = ["heif", "turbojpeg"]
heif = ["tri/heif"]
turbojpeg = ["tri/turbojpeg"]

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"
