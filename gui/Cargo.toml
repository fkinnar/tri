[package]
name = "tri-gui"
version = "1.0.0-beta.1"
edition = "2024"
description = "Interface graphique (egui) de tri, visionneuse RAW"
license = "GPL-3.0-or-later"
repository = "https://github.com/fkinnar/tri"

[[bin]]
name = "tri-gui"
path = "src/main.rs"

[dependencies]
tri = { path = "..", default-features = false }
# Heure locale des dates affichées (déjà tiré par `trash` ; MIT OR Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["preserve_order"] }
# Fenêtre native de choix de fichier (« Parcourir… », 04/11/2026) : NSOpenPanel sur
# macOS, portail XDG sous Linux (libdbus chargée à l'exécution), boîte de Windows. MIT.
rfd = "0.17.2"

# macOS : espace couleur de la fenêtre déclaré au système (`display`, 11/11/2026) ;
# mêmes crates que wgpu (projet objc2, MIT / Apache-2.0 / Zlib), aucune nouvelle source.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CALayer", "CAMetalLayer", "objc2-core-graphics"] }

[features]
# Mêmes features que le moteur, transmises telles quelles.
default = ["heif", "turbojpeg"]
heif = ["tri/heif"]
turbojpeg = ["tri/turbojpeg"]

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
tempfile = "3"
