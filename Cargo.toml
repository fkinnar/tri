[workspace]
members = ["gui"]

[package]
name = "tri"
version = "1.0.0-alpha.1"
edition = "2024"
description = "Moteur de tri : lecture des RAW (LibRaw) et images, aperçus en cache, notes XMP, filtres, analyses"
license = "GPL-3.0-or-later"
repository = "https://github.com/fkinnar/tri"

[dependencies]
blake3 = "1"
kamadak-exif = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
# Profils ICC des exports sans darktable (déjà compilé par `image`, même version).
moxcms = "0.8"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"], optional = true }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
trash = "5"
turbojpeg = { version = "1", default-features = false, features = ["cmake", "pkg-config", "require-simd"], optional = true }
walkdir = "2.5.0"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
fluent-syntax = "0.12"

# macOS : emplacement d'un fichier mis à la corbeille (annulation), déjà présents par
# le crate `trash`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSFileManager", "NSString", "NSURL"] }
# Envoi par AirDrop (feuille de partage du système, `send::AirDrop`) ; déjà présents par
# winit (même projet que objc2-foundation).
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSharingService"] }

[features]
default = ["heif", "turbojpeg"]
# HEIC/HEIF via libheif. HEVC est breveté : désactivable pour un binaire distribué
# (cargo build --no-default-features). Voir doc/licensing.md.
heif = ["dep:libheif-rs"]
# JPEG via libjpeg-turbo 3.x, compilée depuis les sources embarquées par turbojpeg-sys
# (CMake + NASM requis ; TURBOJPEG_SOURCE=pkg-config pour celle du système, si ≥ 3.0).
# Décodage 1,6–2,5× et encodage 4× plus rapides.
# Sans elle, repli sur le décodeur/encodeur pur Rust du crate image. Voir doc/jpeg.md.
turbojpeg = ["dep:turbojpeg"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
pkg-config = "0.3.34"
