[package]
name = "tri"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
libheif-rs = { version = "3", optional = true }
walkdir = "2.5.0"

[features]
default = ["heif"]
# HEIC/HEIF via libheif. HEVC est breveté : désactivable pour un binaire distribué
# (cargo build --no-default-features). Voir doc/licensing.md.
heif = ["dep:libheif-rs"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
pkg-config = "0.3.34"
